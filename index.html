<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FET HUB | Resource Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1a2a3a; --accent: #3498db; --success: #2ecc71; --bg: #f4f7f6; --white: #ffffff; }
        body { font-family: 'Fredoka', sans-serif; margin: 0; background: var(--bg); color: var(--primary); }
        
        .banner { background: var(--primary); color: white; padding: 50px 5%; text-align: center; }
        .banner h1 { font-size: 4rem; margin: 0; text-transform: uppercase; letter-spacing: -2px; }
        .banner span { color: var(--accent); }
        
        .container { max-width: 1000px; margin: -30px auto 40px; padding: 0 20px; }
        .card-box { background: var(--white); padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 30px; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; font-family: 'Fredoka'; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 14px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%; font-family: 'Fredoka'; transition: 0.3s; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .resource-card { background: white; padding: 20px; border-radius: 20px; border-top: 6px solid var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tag { font-size: 0.7rem; font-weight: 700; color: var(--accent); text-transform: uppercase; background: #ebf5fb; padding: 4px 8px; border-radius: 5px; margin-right: 5px; }
        
        #userStatus { text-align: right; padding: 10px 5%; font-size: 0.8rem; background: #eee; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="userStatus">Checking Connection...</div>

<section class="banner">
    <h1>FET <span>HUB</span></h1>
    <p>Taiwan's Resource Exchange for Educators</p>
</section>

<div class="container">
    
    <div id="authArea" class="card-box">
        <h2 style="text-align: center; margin-top: 0;">Teacher Access</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn" onclick="handleAuth('signup')">Create Account</button>
            <button class="btn" style="background:var(--success)" onclick="handleAuth('login')">Log In</button>
        </div>
    </div>

    <div id="uploadArea" class="card-box hidden">
        <h2 style="margin-top: 0;">📤 Upload Material</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <input type="text" id="fileTitle" placeholder="Activity Title">
            <select id="fileLevel">
                <option value="ES">Elementary (ES)</option>
                <option value="JHS">Junior High (JHS)</option>
                <option value="SHS">Senior High (SHS)</option>
            </select>
            <input type="text" id="fileTopic" placeholder="Topic (e.g. Grammar)">
            <input type="text" id="fileTextbook" placeholder="Textbook (e.g. Nani)">
        </div>
        <input type="file" id="fileInput" style="margin-top:10px;">
        <button class="btn" id="uploadBtn" onclick="uploadResource()">Add to Community</button>
    </div>

    <div class="card-box">
        <h2 style="margin-top: 0;">🔍 Search</h2>
        <input type="text" id="searchInput" onkeyup="search()" placeholder="Search topics, textbooks, or titles...">
        <div class="grid" id="mainGrid" style="margin-top:20px;">Loading resources...</div>
    </div>
</div>

<script>
    // Configuration
    const SB_URL = 'https://jwvnqbwlrtyorsasbinu.supabase.co';
    const SB_KEY = 'sb_publishable_oBbh6V91NJwHAb30qsA0GA_TC33nFDB'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let allData = [];

    // Auth Observer
    _supabase.auth.onAuthStateChange((event, session) => {
        const authArea = document.getElementById('authArea');
        const uploadArea = document.getElementById('uploadArea');
        const status = document.getElementById('userStatus');

        if (session) {
            authArea.classList.add('hidden');
            uploadArea.classList.remove('hidden');
            status.innerHTML = `Signed in as <b>${session.user.user_metadata.display_name || 'Teacher'}</b> | <a href="#" onclick="logout()">Logout</a>`;
        } else {
            authArea.classList.remove('hidden');
            uploadArea.classList.add('hidden');
            status.innerHTML = "Guest Mode";
        }
        fetchData();
    });

    async function logout() {
        await _supabase.auth.signOut();
        location.reload();
    }

    async function handleAuth(type) {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if(!user || !pass) return alert("Fields required!");
        
        // Supabase requires an email format, so we create a virtual one from the username
        const dummyEmail = `${user.toLowerCase().replace(/\s/g, '')}@fethub.local`;

        if (type === 'signup') {
            const { error } = await _supabase.auth.signUp({ 
                email: dummyEmail, 
                password: pass, 
                options: { data: { display_name: user } } 
            });
            if (error) alert("Signup Error: " + error.message);
            else alert("Account created! You can now log in.");
        } else {
            const { error } = await _supabase.auth.signInWithPassword({ 
                email: dummyEmail, 
                password: pass 
            });
            if (error) alert("Login failed. Check your credentials.");
        }
    }

    async function fetchData() {
        const { data, error } = await _supabase
            .from('activities')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) {
            console.error("Fetch Error:", error);
            document.getElementById('mainGrid').innerHTML = "Error loading data.";
            return;
        }
        
        allData = data || [];
        render(allData);
    }

    function render(list) {
        if (list.length === 0) {
            document.getElementById('mainGrid').innerHTML = "No resources found.";
            return;
        }

        document.getElementById('mainGrid').innerHTML = list.map(i => `
            <div class="resource-card">
                <span class="tag">${i.level}</span>
                <span class="tag" style="background:#fdedec; color:#e74c3c;">${i.topic || 'General'}</span>
                <h3 style="margin:10px 0;">${i.title}</h3>
                <p style="font-size:0.8rem; color:#666;">Textbook: ${i.textbook || 'Any'}</p>
                <button class="btn" style="padding:8px; font-size:0.8rem;" onclick="window.open('${i.file_url}', '_blank')">Download</button>
            </div>
        `).join('');
    }

    function search() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allData.filter(r => 
            r.title.toLowerCase().includes(term) || 
            (r.topic && r.topic.toLowerCase().includes(term)) || 
            (r.textbook && r.textbook.toLowerCase().includes(term))
        );
        render(filtered);
    }

    async function uploadResource() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        const title = document.getElementById('fileTitle').value;
        const uploadBtn = document.getElementById('uploadBtn');

        if (!file || !title) return alert("Please provide both a Title and a File.");

        // UI Feedback
        uploadBtn.innerText = "Uploading... Please wait";
        uploadBtn.disabled = true;

        try {
            // 1. Upload File to Storage Bucket 'resources'
            const fileName = `${Date.now()}_${file.name.replace(/\s/g, '_')}`;
            const { data: storageData, error: storageError } = await _supabase.storage
                .from('resources')
                .upload(fileName, file);

            if (storageError) throw storageError;

            // 2. Generate Public URL
            const { data: publicUrlData } = _supabase.storage
                .from('resources')
                .getPublicUrl(fileName);

            const fileUrl = publicUrlData.publicUrl;

            // 3. Save Metadata to 'activities' Table
            const { error: dbError } = await _supabase
                .from('activities')
                .insert([{ 
                    title: title, 
                    level: document.getElementById('fileLevel').value, 
                    topic: document.getElementById('fileTopic').value, 
                    textbook: document.getElementById('fileTextbook').value, 
                    file_url: fileUrl 
                }]);

            if (dbError) throw dbError;

            alert("Resource successfully shared!");
            location.reload(); // Refresh to show the new item

        } catch (err) {
            console.error("Upload process failed:", err);
            alert("Error: " + err.message);
        } finally {
            uploadBtn.innerText = "Add to Community";
            uploadBtn.disabled = false;
        }
    }
</script>

</body>
</html>
