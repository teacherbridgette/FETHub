<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FET HUB | Taiwan Resource Exchange</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #1a2a3a;
            --accent: #3498db;
            --success: #2ecc71;
            --bg: #f4f7f6;
            --white: #ffffff;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--primary);
        }

        /* --- BIG BANNER SECTION --- */
        .banner {
            background: var(--primary);
            color: white;
            padding: 80px 5%;
            text-align: center;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.2);
        }

        .banner h1 {
            font-size: 5rem;
            margin: 0;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .banner h1 span {
            color: var(--accent);
        }

        .banner p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-top: 10px;
        }

        /* --- CONTAINER & LAYOUT --- */
        .container {
            max-width: 1000px;
            margin: -40px auto 40px;
            padding: 0 20px;
        }

        /* --- AUTH & UPLOAD CARDS --- */
        .card-box {
            background: var(--white);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .auth-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: center;
        }

        @media (max-width: 600px) {
            .auth-grid { grid-template-columns: 1fr; }
            .banner h1 { font-size: 3rem; }
        }

        /* --- FORMS & BUTTONS --- */
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-family: 'Fredoka';
            box-sizing: border-box;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            font-family: 'Fredoka';
        }

        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-alt { background: var(--success); }

        /* --- RESOURCE GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .resource-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            border-top: 6px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .tag {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
        }

        #userStatus {
            text-align: right;
            padding: 10px 5%;
            font-size: 0.8rem;
            background: #eee;
        }
    </style>
</head>
<body>

<div id="userStatus">Checking connection...</div>

<section class="banner">
    <h1>FET <span>HUB</span></h1>
    <p>Professional Exchange for Taiwan's English Educators</p>
</section>

<div class="container">
    
    <div id="authArea" class="card-box">
        <h2 style="text-align: center; margin-top: 0;">Teacher Access</h2>
        <p style="text-align: center; font-size: 0.9rem; color: #666;">Create an account to upload your JHS/SHS materials.</p>
        <div class="auth-grid">
            <div>
                <input type="email" id="email" placeholder="Email Address">
                <input type="password" id="password" placeholder="Password (min 6 chars)">
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn" onclick="handleAuth('signup')">Sign Up (Verify Email)</button>
                <button class="btn btn-alt" onclick="handleAuth('login')">Login</button>
            </div>
        </div>
    </div>

    <div id="uploadArea" class="card-box" style="display: none;">
        <h2 style="margin-top: 0;">📤 Share a Resource</h2>
        <div class="auth-grid">
            <div>
                <input type="text" id="fileTitle" placeholder="Activity Title (e.g. Past Tense Bingo)">
                <select id="fileLevel">
                    <option>Elementary School</option>
                    <option>Junior High</option>
                    <option>Senior High</option>
                </select>
            </div>
            <div>
                <input type="file" id="fileInput">
                <button class="btn" id="uploadBtn" onclick="uploadResource()">Upload to Community</button>
            </div>
        </div>
        <p id="uploadStatus" style="font-size: 0.8rem; margin-top: 10px; color: var(--accent);"></p>
    </div>

    <h2 style="margin-top: 40px;">✨ Latest Resources</h2>
    <div class="grid" id="mainGrid">
        <p>Loading the latest activities...</p>
    </div>

</div>

<script>
    // --- DATABASE CONNECTION ---
    const SB_URL = 'https://jwvnqbwlrtyorsasbinu.supabase.co';
    const SB_KEY = 'sb_publishable_oBbh6V91NJwHAb30qsA0GA_TC33nFDB'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // --- 1. SESSION MONITOR ---
    _supabase.auth.onAuthStateChange((event, session) => {
        const authArea = document.getElementById('authArea');
        const uploadArea = document.getElementById('uploadArea');
        const status = document.getElementById('userStatus');

        if (session) {
            authArea.style.display = 'none';
            uploadArea.style.display = 'block';
            status.innerHTML = `Signed in as: <b>${session.user.email}</b> | <a href="#" onclick="logout()">Logout</a>`;
        } else {
            authArea.style.display = 'block';
            uploadArea.style.display = 'none';
            status.innerHTML = "Not signed in (Viewing Mode)";
        }
        loadResources();
    });

    // --- 2. AUTH LOGIC ---
    async function handleAuth(type) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) return alert("Please fill in both fields.");

        if (type === 'signup') {
            const { error } = await _supabase.auth.signUp({ email, password });
            if (error) alert(error.message);
            else alert("Account created! Check your email to verify your account before logging in.");
        } else {
            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) alert("Login error: " + error.message);
        }
    }

    async function logout() {
        await _supabase.auth.signOut();
        location.reload();
    }

    // --- 3. RESOURCE LOADING ---
    async function loadResources() {
        const { data, error } = await _supabase.from('activities').select('*').order('created_at', { ascending: false });
        const grid = document.getElementById('mainGrid');
        
        if (data && data.length > 0) {
            grid.innerHTML = data.map(i => `
                <div class="resource-card">
                    <span class="tag">${i.level}</span>
                    <h3 style="margin: 10px 0;">${i.title}</h3>
                    <button class="btn" style="font-size: 0.8rem; padding: 8px;" onclick="window.open('${i.file_url}')">Download Resource</button>
                </div>
            `).join('');
        } else {
            grid.innerHTML = "<p>No resources found. Be the first to share one!</p>";
        }
    }

    // --- 4. UPLOAD LOGIC ---
    async function uploadResource() {
        const file = document.getElementById('fileInput').files[0];
        const title = document.getElementById('fileTitle').value;
        const level = document.getElementById('fileLevel').value;
        const status = document.getElementById('uploadStatus');

        if (!file || !title) return alert("Please provide a title and a file.");

        status.innerText = "Processing upload...";
        
        try {
            // A. Upload to Storage
            const path = `resources/${Date.now()}_${file.name}`;
            const { data: sData, error: sErr } = await _supabase.storage.from('resources').upload(path, file);
            if (sErr) throw sErr;

            // B. Get Public URL
            const { data: urlData } = _supabase.storage.from('resources').getPublicUrl(path);

            // C. Insert into Database
            const { error: dbErr } = await _supabase.from('activities').insert([
                { title, level, file_url: urlData.publicUrl }
            ]);
            if (dbErr) throw dbErr;

            alert("Resource shared successfully!");
            location.reload();
        } catch (err) {
            alert("Upload failed: " + err.message);
            status.innerText = "";
        }
    }

    loadResources();
</script>

</body>
</html>
