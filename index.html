<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FET HUB | Resource Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1a2a3a; --accent: #3498db; --success: #2ecc71; --bg: #f4f7f6; --white: #ffffff; }
        body { font-family: 'Fredoka', sans-serif; margin: 0; background: var(--bg); color: var(--primary); }
        .banner { background: var(--primary); color: white; padding: 50px 5%; text-align: center; }
        .banner h1 { font-size: 4rem; margin: 0; text-transform: uppercase; letter-spacing: -2px; }
        .banner span { color: var(--accent); }
        .container { max-width: 1000px; margin: -30px auto 40px; padding: 0 20px; }
        .card-box { background: var(--white); padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 30px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; font-family: 'Fredoka'; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 14px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%; font-family: 'Fredoka'; transition: 0.3s; margin-top: 5px; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .resource-card { background: white; padding: 20px; border-radius: 20px; border-top: 6px solid var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tag { font-size: 0.7rem; font-weight: 700; color: var(--accent); text-transform: uppercase; background: #ebf5fb; padding: 4px 8px; border-radius: 5px; margin-right: 5px; }
        #userStatus { text-align: right; padding: 10px 5%; font-size: 0.8rem; background: #eee; }
        .hidden { display: none; }
        .auth-toggle { text-align: center; margin-top: 15px; font-size: 0.9rem; cursor: pointer; color: var(--accent); text-decoration: underline; }
    </style>
</head>
<body>

<div id="userStatus">Checking Connection...</div>

<section class="banner">
    <h1>FET <span>HUB</span></h1>
    <p>Taiwan's Resource Exchange for Educators</p>
</section>

<div class="container">
    
    <div id="authArea" class="card-box">
        <h2 id="authTitle" style="text-align: center; margin-top: 0;">Teacher Login</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        
        <button id="authBtn" class="btn" style="background:var(--success)" onclick="handleAuth()">Log In</button>
        
        <div style="margin: 15px 0; text-align: center; color: #999;">OR</div>
        
        <button class="btn" style="background:#4285F4;" onclick="loginWithGoogle()">
            Sign in with Google
        </button>

        <p class="auth-toggle" id="authSwitcher" onclick="toggleAuthMode()">Don't have an account? Sign Up</p>
    </div>

    <div id="uploadArea" class="card-box hidden">
        <h2 style="margin-top: 0;">📤 Upload Material</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <input type="text" id="fileTitle" placeholder="Activity Title">
            <select id="fileLevel">
                <option value="ES">Elementary (ES)</option>
                <option value="JHS">Junior High (JHS)</option>
                <option value="SHS">Senior High (SHS)</option>
            </select>
            <input type="text" id="fileTopic" placeholder="Topic">
            <input type="text" id="fileTextbook" placeholder="Textbook">
        </div>
        <input type="file" id="fileInput" style="margin-top:10px;">
        <button class="btn" id="uploadBtn" onclick="uploadResource()">Add to Community</button>
    </div>

    <div class="card-box">
        <h2 style="margin-top: 0;">🔍 Search</h2>
        <input type="text" id="searchInput" onkeyup="search()" placeholder="Search topics, textbooks, or titles...">
        <div class="grid" id="mainGrid" style="margin-top:20px;">Loading resources...</div>
    </div>
</div>

<script>
    const SB_URL = 'https://jwvnqbwlrtyorsasbinu.supabase.co';
    const SB_KEY = 'sb_publishable_oBbh6V91NJwHAb30qsA0GA_TC33nFDB'; 
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    
    let isSignUpMode = false;
    let allData = [];

    // Toggle between Login and Signup UI
    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('authTitle').innerText = isSignUpMode ? "Create Teacher Account" : "Teacher Login";
        document.getElementById('authBtn').innerText = isSignUpMode ? "Register Now" : "Log In";
        document.getElementById('authSwitcher').innerText = isSignUpMode ? "Already have an account? Log In" : "Don't have an account? Sign Up";
    }

    // Auth Observer
    _supabase.auth.onAuthStateChange((event, session) => {
        const authArea = document.getElementById('authArea');
        const uploadArea = document.getElementById('uploadArea');
        const status = document.getElementById('userStatus');

        if (session) {
            authArea.classList.add('hidden');
            uploadArea.classList.remove('hidden');
            status.innerHTML = `Signed in as <b>${session.user.email}</b> | <a href="#" onclick="logout()">Logout</a>`;
        } else {
            authArea.classList.remove('hidden');
            uploadArea.classList.add('hidden');
            status.innerHTML = "Guest Mode";
        }
        fetchData();
    });

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) return alert("Please fill in all fields.");

        if (isSignUpMode) {
            const { data, error } = await _supabase.auth.signUp({
                email: email,
                password: password,
                options: { emailRedirectTo: window.location.origin }
            });
            if (error) alert(error.message);
            else alert("Signup successful! Please check your email for the verification link.");
        } else {
            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) alert("Login failed: " + error.message);
        }
    }

    async function loginWithGoogle() {
        await _supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin }
        });
    }

    async function logout() {
        await _supabase.auth.signOut();
        location.reload();
    }

    async function fetchData() {
        const { data } = await _supabase.from('activities').select('*').order('created_at', { ascending: false });
        allData = data || [];
        render(allData);
    }

    function render(list) {
        document.getElementById('mainGrid').innerHTML = list.map(i => `
            <div class="resource-card">
                <span class="tag">${i.level}</span>
                <h3 style="margin:10px 0;">${i.title}</h3>
                <p style="font-size:0.8rem; color:#666;">${i.topic} | ${i.textbook}</p>
                <button class="btn" style="padding:8px; font-size:0.8rem;" onclick="window.open('${i.file_url}', '_blank')">Download</button>
            </div>
        `).join('');
    }

    function search() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        render(allData.filter(r => r.title.toLowerCase().includes(term) || (r.topic && r.topic.toLowerCase().includes(term))));
    }

    async function uploadResource() {
        const file = document.getElementById('fileInput').files[0];
        const title = document.getElementById('fileTitle').value;
        if (!file || !title) return alert("Title and File required!");

        const btn = document.getElementById('uploadBtn');
        btn.innerText = "Uploading...";
        btn.disabled = true;

        try {
            const path = `resources/${Date.now()}_${file.name}`;
            const { error: sErr } = await _supabase.storage.from('resources').upload(path, file);
            if (sErr) throw sErr;

            const { data: urlData } = _supabase.storage.from('resources').getPublicUrl(path);
            const { error: dbErr } = await _supabase.from('activities').insert([{ 
                title, 
                level: document.getElementById('fileLevel').value, 
                topic: document.getElementById('fileTopic').value, 
                textbook: document.getElementById('fileTextbook').value, 
                file_url: urlData.publicUrl 
            }]);

            if (dbErr) throw dbErr;
            alert("Uploaded successfully!");
            location.reload();
        } catch (err) {
            alert(err.message);
        } finally {
            btn.innerText = "Add to Community";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
