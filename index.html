<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Document Hub</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body style="font-family: Arial, sans-serif; padding: 40px; max-width: 600px; margin: 0 auto;">

    <h2>Teacher Resource Upload</h2>
    <p>Click the button below to link a lesson plan or resource directly from your Google Drive.</p>
    
    <button id="upload-btn" onclick="handleAuthClick()" style="padding: 12px 24px; font-size: 16px; background-color: #4285F4; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Select File from Google Drive
    </button>
    
    <div id="result" style="margin-top: 30px; padding: 15px; border: 1px dashed #ccc; display: none; border-radius: 4px;"></div>

    <script>
        // =========================================================
        // ⚠️ PASTE YOUR CODES FROM YOUR NOTEPAD HERE
        // =========================================================
        const CLIENT_ID = '520012417131-t2l8pm3jbf8ng2j8jruita0v5qfcpfgf.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyB02Z5TpGjAdJS3zX-k3HROlx_ce3cPHqg';
        
        // This tells Google we only want access to files they manually click on
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let accessToken = null;

        // Initialize Google API and Picker libraries
        gapi.load('client:picker', async () => {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
            });
        });

        // Initialize the OAuth Token Client
        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // Handled dynamically when button is clicked
            });
        };

        // This triggers when the teacher clicks your blue button
        function handleAuthClick() {
            tokenClient.callback = async (response) => {
                if (response.error !== undefined) {
                    throw response;
                }
                accessToken = response.access_token;
                createPicker(); // Launch the picker once they log in successfully
            };

            // Request access token (pops open the Google Sign-In window)
            if (accessToken === null) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }

        // Build and display the Google Picker window
        function createPicker() {
            const docsView = new google.picker.DocsView()
                .setIncludeFolders(true) // Lets them look through their Drive folders
                .setSelectFolderEnabled(false); // They must select an actual file, not a folder

            const picker = new google.picker.PickerBuilder()
                .addView(docsView)
                .setOAuthToken(accessToken)
                .setDeveloperKey(API_KEY)
                .setCallback(pickerCallback)
                .build();
                
            picker.setVisible(true);
        }

        // This runs the millisecond the teacher selects a file and hits "Select"
        function pickerCallback(data) {
            if (data[google.picker.Response.ACTION] == google.picker.Action.PICKED) {
                const doc = data[google.picker.Response.DOCUMENTS][0];
                
                const fileId = doc[google.picker.Document.ID];
                const fileName = doc[google.picker.Document.NAME];
                const fileUrl = doc[google.picker.Document.URL]; // This is the public viewable link

                // Show the file details on the screen
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <h3 style="color: green; margin-top: 0;">✅ File Successfully Linked!</h3>
                    <strong>Name:</strong> ${fileName}<br>
                    <strong>Google Drive URL:</strong> <a href="${fileUrl}" target="_blank">${fileUrl}</a>
                `;

                // NEXT STEP: Send these variables over to your Supabase database!
                saveToSupabase(fileName, fileUrl);
            }
        }

        // Placeholder for your Supabase logic
        function saveToSupabase(name, url) {
            console.log("Ready to send to Supabase! Name:", name, "URL:", url);
            
            // Once your Supabase client is initialized, it will look like this:
            // const { data, error } = await supabase
            //     .from('teacher_documents')
            //     .insert([{ document_name: name, google_drive_url: url }]);
        }
    </script>
</body>
</html>
